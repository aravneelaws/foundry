# Synthetic dataset for RF3 benchmarking.
# Generates random tensors matching production training dimensions.
# No external data dependencies required.

# Base transform defaults (must be present for Hydra resolution)
diffusion_batch_size_train: 48
diffusion_batch_size_inference: 5
n_recycles_train: 4
n_recycles_validation: 10
run_confidence_head: false
n_msa: 1024
crop_size: 384
max_atoms_in_crop: 5000

# Not used by synthetic dataset but required by Hydra config schema
p_unconditional: 0.9
p_dropout_atom_level_embeddings: 0.5
key_to_balance: null
take_first_chiral_subordering: false
use_element_for_atom_names_of_atomized_tokens: true
mirror_prob: 0.0
atomization_prob: 0.0
ligand_dropout_prob: 0.0
add_residue_is_paired_feature: false
add_cyclic_bonds: false

# Training dataset: single leaf dataset with probability 1.0
train:
  synthetic:
    probability: 1.0
    dataset:
      _target_: rf3.data.synthetic.SyntheticRF3Dataset
      num_examples: 1000
      num_tokens: ${datasets.crop_size}
      num_atoms: 3072
      diffusion_batch_size: ${datasets.diffusion_batch_size_train}
      num_msa_sequences: ${datasets.n_msa}
      n_recycles: ${datasets.n_recycles_train}
      seed: 42

# No validation dataset for benchmarking
val: null
